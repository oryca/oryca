<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f4f5f7;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1a1c1f">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:32px">
            <tr>
              <td>
                <h1 style="margin:0 0 16px;font-size:20px;font-weight:600">Set your password</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.6">Hi {{name}},</p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6">
                  Choose a password to access your account. This link expires shortly.
                </p>
                <p style="margin:0 0 24px">
                  <a href="{{link}}" style="display:inline-block;padding:12px 24px;background:#1a1c1f;color:#ffffff;border-radius:6px;text-decoration:none;font-size:15px">Set password</a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280">
                  If the button does not work, copy this link into your browser:<br />
                  <span style="word-break:break-all">{{link}}</span>
                </p>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6b7280">
                  If you did not request this, you can ignore this message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
