# Transactional email templates.
#
# Seeded ONCE, per alias, on the first boot against an empty database. An alias
# that already exists is left untouched, so edits made through the portal or the
# API survive restarts — and adding a new entry here later still seeds that one.
#
# `alias` is what the code looks up; do not rename the two below. `{{name}}` and
# `{{link}}` are substituted at send time; a placeholder with no matching value
# is left in the message as-is, so only use the variables listed per template.

templates:
  - alias: oryca.verify-email
    name: Verify email address
    type: system
    default: true
    system: true
    subject: Verify your email address
    variables: [name, link]
    htmlBody: |
      <!doctype html>
      <html>
        <body style="margin:0;padding:24px;background:#f4f5f7;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1a1c1f">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:32px">
                  <tr>
                    <td>
                      <h1 style="margin:0 0 16px;font-size:20px;font-weight:600">Verify your email address</h1>
                      <p style="margin:0 0 16px;font-size:15px;line-height:1.6">Hi {{name}},</p>
                      <p style="margin:0 0 24px;font-size:15px;line-height:1.6">
                        Confirm this address to finish setting up your account.
                      </p>
                      <p style="margin:0 0 24px">
                        <a href="{{link}}" style="display:inline-block;padding:12px 24px;background:#1a1c1f;color:#ffffff;border-radius:6px;text-decoration:none;font-size:15px">Verify email</a>
                      </p>
                      <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280">
                        If the button does not work, copy this link into your browser:<br />
                        <span style="word-break:break-all">{{link}}</span>
                      </p>
                      <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6b7280">
                        If you did not create an account, you can ignore this message.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </body>
      </html>

  - alias: oryca.set-password
    name: Set password
    type: system
    default: true
    system: true
    subject: Set your password
    variables: [name, link]
    htmlBody: |
      <!doctype html>
      <html>
        <body style="margin:0;padding:24px;background:#f4f5f7;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1a1c1f">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:32px">
                  <tr>
                    <td>
                      <h1 style="margin:0 0 16px;font-size:20px;font-weight:600">Set your password</h1>
                      <p style="margin:0 0 16px;font-size:15px;line-height:1.6">Hi {{name}},</p>
                      <p style="margin:0 0 24px;font-size:15px;line-height:1.6">
                        Choose a password to access your account. This link expires shortly.
                      </p>
                      <p style="margin:0 0 24px">
                        <a href="{{link}}" style="display:inline-block;padding:12px 24px;background:#1a1c1f;color:#ffffff;border-radius:6px;text-decoration:none;font-size:15px">Set password</a>
                      </p>
                      <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280">
                        If the button does not work, copy this link into your browser:<br />
                        <span style="word-break:break-all">{{link}}</span>
                      </p>
                      <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6b7280">
                        If you did not request this, you can ignore this message.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </body>
      </html>
