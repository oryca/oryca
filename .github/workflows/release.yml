name: Release

# Tag a commit to publish images:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Anyone can then run a release without a Go toolchain:
#   docker pull ghcr.io/oryca/oryca-gateway:0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: oryca-gateway
            context: .
            dockerfile: gateway/Dockerfile
          - image: oryca-control-plane
            context: .
            dockerfile: control-plane/Dockerfile
          # The portal reads its addresses when it serves a page, so one image
          # works on any domain.
          - image: oryca-portal
            context: ./portal
            dockerfile: ./portal/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The binaries are static (cgo off), so arm64 cross-builds without emulation.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish the release notes
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The tag message is the release notes: it is written when the release is
      # cut, by whoever knows what changed.
      - id: notes
        run: |
          {
            echo 'body<<TAG_MESSAGE_EOF'
            git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}"
            echo
            echo '## Images'
            echo
            echo '```sh'
            for image in oryca-gateway oryca-control-plane oryca-portal; do
              echo "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${GITHUB_REF_NAME#v}"
            done
            echo '```'
            echo
            echo 'Or run the whole stack, pinned to this version:'
            echo
            echo '```sh'
            echo "curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/docker-compose.images.yml"
            echo "curl -fsSL -o .env https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.env.example"
            echo "ORYCA_VERSION=${GITHUB_REF_NAME#v} docker compose up -d"
            echo '```'
            echo 'TAG_MESSAGE_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
