name: Release

# Tag a commit to publish images:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Anyone can then run a release without a Go toolchain:
#   docker pull ghcr.io/oryca/oryca-gateway:0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: oryca-gateway
            context: .
            dockerfile: gateway/Dockerfile
          - image: oryca-control-plane
            context: .
            dockerfile: control-plane/Dockerfile
          # The portal's addresses are written into its bundle at build time, so a
          # published image can only carry the local defaults. Anyone serving it
          # from a domain of their own builds it themselves.
          - image: oryca-portal
            context: ./portal
            dockerfile: ./portal/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The binaries are static (cgo off), so arm64 cross-builds without emulation.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
