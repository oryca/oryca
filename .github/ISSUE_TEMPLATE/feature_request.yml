name: Idea or request
description: Something you wish it did
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem you ran into, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Optional. Rough ideas are welcome.
